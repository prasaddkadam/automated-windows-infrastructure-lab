<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc">
<title id="title">Windows infrastructure lab architecture</title>
<desc id="desc">Windows management workstation connects over a home LAN to a bare metal Proxmox host that runs DC01 and FS01, with optional CLIENT01. External backup storage is used for periodic backups, not live VM disks.</desc>
